[project]
name = "rtllm"
version = "2.1.0"
description = "RTLLM: An Open-Source Benchmark for Generating Register-Transfer Level (RTL) Hardware with AI Agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "verilator>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "types-tqdm>=4.65.0",
]
